name: figaroh-examples
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10  # floor of the pinned core (requires-python >=3.10)
  - pip

  # Core scientific computing - used extensively in examples
  - numpy
  - scipy
  - matplotlib
  - pandas

  # Robotics and optimization - required for figaroh functionality
  - pinocchio
  - cyipopt

  # Install remaining via pip
  - pip:
    - figaroh>=1.2,<1.3  # paired core release; see README "Core compatibility"