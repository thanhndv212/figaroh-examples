ci:
    autoupdate_branch: 'devel'
repos:
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black
        language_version: python3
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: check-added-large-files
        args: ['--maxkb=100000']
        exclude: |
            (?x)^(
                models/.*|
                examples/.*/urdf/.*|
                examples/.*/data/.*|
            )$
    -   id: check-ast
    -   id: check-merge-conflict
    -   id: check-yaml
        exclude: |
            (?x)^(
                models/.*\.yaml
            )$
    -   id: debug-statements
    -   id: trailing-whitespace
-   repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
    -   id: flake8
        # --extend-ignore, not --ignore: the latter REPLACES flake8's default
        # ignore list. W503 is already a default; it was listed here only to
        # undo that clobbering. E203 is not a default and stays explicit
        # (black emits it).
        args: ['--extend-ignore=E501,E203']
        additional_dependencies: ['importlib-metadata<7.0']
