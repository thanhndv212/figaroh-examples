name: 'Bug report'
description: 'An example script, dataset, config or validate.py that crashes or gives a wrong result.'
title: "fix(<area>): "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 'What happened'
      description: 'Expected vs. actual behaviour, and the impact (wrong result, crash, silent skip).'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 'How to reproduce'
      description: 'Robot folder and exact command (run from examples/<robot>/), config, data files, units, joint order and seeds.'
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 'Logs'
      description: 'Traceback or output. For validate.py, attach the files under validation_logs/ for the failing check.'
      render: text
  - type: textarea
    id: environment
    attributes:
      label: 'Environment'
      description: 'figaroh-plus and figaroh-examples commits, Python, OS, `conda list | grep -i -E "pinocchio|cyipopt|mujoco"`.'
    validations:
      required: true
