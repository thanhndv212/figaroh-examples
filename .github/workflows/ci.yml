name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Examples (pinocchio-${{ matrix.pinocchio }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pinocchio: ['3.7.0', '4.1.0']
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PIP_CONSTRAINT: ${{ github.workspace }}/ci-constraints.txt
    steps:
      - uses: actions/checkout@v4
        with:
          path: figaroh-examples

      - uses: actions/checkout@v4
        with:
          repository: thanhndv212/figaroh-plus
          ref: devel
          path: figaroh

      # Mesh packages the example URDFs need beyond models/, fetched at the
      # revisions pinned in scripts/fetch_models.py (never copied into this
      # repository; see models/README.md).
      - name: Fetch pinned mesh packages
        run: |
          python3 figaroh-examples/scripts/fetch_models.py --dest ci-models
          echo "ROS_PACKAGE_PATH=$(python3 figaroh-examples/scripts/fetch_models.py --dest ci-models --print-ros-package-path)" >> "$GITHUB_ENV"

      - name: Prepare constrained environment
        env:
          PINOCCHIO_VERSION: ${{ matrix.pinocchio }}
        run: |
          cp "figaroh/ci/pinocchio-${PINOCCHIO_VERSION}.txt" "$PIP_CONSTRAINT"
          cat >> "$PIP_CONSTRAINT" <<'PINS'
          numpy==2.3.2
          scipy==1.16.1
          picos==2.6.1
          cvxopt==1.3.2
          PINS
          # Core is installed editable after activation, from its checkout.
          sed '/  - pip:/,$d' figaroh/environment.yml > ci-environment.yml

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: ci-environment.yml
          activate-environment: figaroh-dev

      - name: Install figaroh
        shell: bash -el {0}
        run: |
          python -m pip install -e './figaroh[dev]'
          python -m pip check
          python -c "import figaroh, pinocchio; print('figaroh', figaroh.__file__, 'pinocchio', pinocchio.__version__)"
          echo "figaroh-plus devel: $(git -C figaroh rev-parse HEAD)"

      - name: Run examples tests
        shell: bash -el {0}
        run: |
          cd figaroh-examples
          python -m pytest tests/ -v --durations=15
