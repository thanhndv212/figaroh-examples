# define parameters for calibration and identification process
# robot: staubli TX40
#
# This is figaroh's legacy flat config format. For a full field-by-field
# reference (meaning, units, which fields are actually consumed by the
# pipeline), see docs/source/concepts/config_parameters.md in figaroh, or
# https://thanhndv212.github.io/figaroh-plus/concepts/config_parameters/
---
# The calibration: section below is an unfilled template: this example only
# ships identification.py (no calibration script), so these fields are
# parsed but never used. Fill them in the same way as e.g.
# ../../ur10/config/ur10_config.yaml if you add geometric calibration here.
calibration:
  calib_level: # joint_offset | full_params -- unused, no calibration script
  non_geom:    # unused
  base_frame:  # unused
  tool_frame:  # unused
  markers:
    - ref_joint: # unused
      measure: []
  free_flyer:  # unused
  nb_sample:   # unused
identification:
  robot_params:
    # q/dq/ddq/tau_lim_def: joint limit margins. Parsed into the config
    # dict but not currently consumed anywhere in the identification
    # pipeline (kept for schema/future use).
    - q_lim_def: 1.57
      fv : [8.05, 5.53, 1.97, 1.11, 1.86, 0.65] # viscous friction/joint (N.m.s/rad); used, has_friction=True
      fs : [7.14, 8.26, 6.34, 2.48, 3.03, 0.282] # Coulomb/static friction/joint (N.m); used, has_friction=True
      Ia : [0.362, 0.362, 0.0988, 0.0313, 0.0468, 0.0105] # reflected actuator inertia/joint (kg.m^2); used, has_actuator_inertia=True
      offset : [0.392, 1.37, 0.326, -0.102, -0.0288, 0.127] # constant joint torque offset (N.m); used, has_joint_offset=True
      # Iam6/fvm6/fsm6: same 3 quantities as Ia/fv/fs, but for the shared
      # "6th motor" of TX40's differential-coupled wrist (2 motors jointly
      # drive the last 2 wrist axes) -- used since has_coupled_wrist=True.
      Iam6 : 0.00964
      fvm6 : 0.616
      fsm6 : 1.95
      reduction_ratio : [32.0, 32.0, 45.0, -48.0, 45.0, 32.0] # motor turns per joint turn (sign = direction)
      # Threshold (%) for the "essential parameters" selection technique
      # (Pham et al. 1995). Documented intent only -- not currently wired
      # into any solver in this codebase.
      ratio_essential : 30.0
      dq_lim_def : [0.05009095, 0.05009095, 0.07504916, 0.0715585,  0.05585054, 0.12217305]
      ddq_lim_def : 20.0
      tau_lim_def : 4.0
  problem_params:
    - is_external_wrench : False # include a measured F/T sensor wrench as a regressor input
      is_joint_torques : True # regress against joint torque signals (standard inverse-dynamics ID)
      force_torque : None # which F/T channels to use (e.g. ['Fx','Fy','Fz'] or ['All']); only if is_external_wrench
      external_wrench_offsets : False # also identify a constant bias on the F/T reading
      has_friction : True # include fv/fs columns in the regressor
      has_joint_offset : True # include the offset column in the regressor
      has_actuator_inertia : True # include the Ia column in the regressor
      is_static_regressor : True # include the friction+offset ("static") regressor block
      is_inertia_regressor : True # include the rigid-body inertial-parameter regressor block
      has_coupled_wrist: True # last 2 wrist joints share differential actuation -> adds Iam6/fvm6/fsm6 + coupling terms
      embedded_forces : False # express the external wrench in a body-embedded frame instead of world
  processing_params:
    - cut_off_frequency_butterworth: 100.0 # low-pass filter cutoff (Hz) applied before regression
      ts : 0.0002 # sample period (s) of the recorded data
  tls_params:
    - mass_load : 0.0 # known test-payload mass (kg) for optional TLS-based load identification
      which_body_loaded : 0.0 # index of the link/body carrying that payload
      sync_joint_motion : False # parsed but not currently used
...
