# TIAGo suspension OptiTrack runs, 2023-07-26/28 and 2023-09-12 (examples#112),
# for the base-suspension study (#70) as a data-contract Protocol
# (figaroh-plus#55). Roles are frozen: changing a file or a role needs a new
# version.
# The arm swings to excite the base while OptiTrack tracks rigid bodies on the
# robot. There is no force plate in any run: they support free-oscillation and
# base-motion fits only, not the plate-wrench fits of ../suspension/.
# Sources are original recordings (not distributed), one ROS bag per run, named
# by folder, file name and sha256. Each run directory is
# `examples/tiago/utils/suspension_optitrack_extraction.py` of its bag:
# joints.csv (torso_lift and arm_1..7 position and effort, wrist F/T, 100 Hz)
# and one <body>.csv per tracked body (every NatNet sample, `live` = 0 where the
# pose is frozen), values unchanged, re-created byte for byte by
# tests/test_tiago_suspension_optitrack.py.
# One clock: t is the robot clock (introspection header stamp) in s from the
# first joint sample; body rows are the NatNet header stamp + lag_s
# (t_robot - t_mocap, measured on the live tiago_shoulder samples).
# Counts are made at extraction: samples and frozen samples per stream; no
# stream of any run has a repeated or backward stamp.
# Load case: `load` is the run name. load_evidence is the median norm of the
# wrist force (N, uncalibrated; its bias drifts between days, 13.0 N unloaded on
# 07-26 and 16.5 N unloaded on 09-12), so only runs of the same day compare. On
# 09-12 the weight adds 4.2 N (about 0.43 kg); its mass was not recorded.
# Roles follow a rule stated before any fit (no model is fitted or scored on
# these runs in this delivery):
#   1. diagnostic if torso_lift moves more than 50 mm (not the excitation protocol);
#   2. diagnostic if tiago_shoulder is frozen in more than 10 % of its samples;
#   3. diagnostic if a no_weight run reads the wrist force of the same day's
#      weight runs (within 1 N): its load label is contradicted;
#   4. otherwise 2023-07 runs are training; on 2023-09-12 the first run of each
#      (motion, load) is validation and a later repeat is confirmation.
# On 2023-07-28 all eight runs read 16.9 to 17.6 N, so the sensor sees one load
# that day; it cannot tell which label is wrong. The weight runs of that day keep
# their name (rule 3 tests no_weight labels only): weight by name, not confirmed.
# Every load case has training and held-out runs; no_weight has no confirmation.
name: tiago-suspension-optitrack-2023
version: 1
units: {length: m, angle: rad, effort: "N m (arm), N (torso_lift)", force: N, torque: N m, time: s}
frame: "optitrack:world; quaternion qx, qy, qz, qw (scalar last)"
clock: "robot clock (PAL introspection header stamp), s from the first joint sample, rounded to 1 microsecond; NatNet header stamps shifted by lag_s"
force_plate: false
robot: tiago-48
robot_evidence: "maintainer information (2026-10-21, docs/development/tiago-mocap-hardware.md section 15a): the OptiTrack 2023-09-12 sessions and the suspension study are tiago-48. Consistent: Schunk hand channels (gripper_finger_joint, left/right fingertip and wrist_ft force-torque), the hand only tiago-48 carried in 2023 (backlash protocol). Caveat: the median arm_7 position minus absolute-encoder gap is -11.6 to -20.8 mrad here, not the +2 to +7 mrad of tiago-48 in 2023-03 and 2023-11 to 2024-02 (arm_1 -3.8 to +0.3 mrad in all runs but 2023-07-28 13:24 at -22.3, arm_2 -5.6 to +3.1 mrad, in or near the tiago-48 range); an arm_7 encoder re-zero cannot be excluded or confirmed"
bodies:
  tiago_shoulder: "on the torso, every run (lag reference)"
  tiago_hand: "on the hand, 2023-07-26 and 2023-07-28 12:39 only"
  tiago_base: "on the mobile base, 2023-09-12 only"
  tiago_schunk: "on the Schunk hand, the four 2023-09-12 unloaded runs"
  tiago_object: "on the weight, five of the seven 2023-09-12 loaded runs (not 16:41, 16:43)"
sessions:
