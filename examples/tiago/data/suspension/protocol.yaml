# TIAGo CREPS Vicon and force-plate runs, 2023-09-20 (examples#111), for the
# base-suspension study (#70) as a data-contract Protocol (figaroh-plus#55).
# Roles are frozen: changing a file or a role needs a new version.
# Sources are original recordings (not distributed), named by file name and
# sha256. Each shipped file is `examples/tiago/utils/suspension_extraction.py`
# of its source: header line dropped, the 40 columns selected by name in the
# order of the first shipped run, CRLF line ends written as LF, every field
# copied as text (values unchanged). `xyz_1640` was shipped before this
# protocol and is byte-identical to its source and to the extractor output.
# Columns: time (host receive time, local, `YYYY-MM-DD_HH:MM:SS.ffffff`), the
# x, y, z of base1..3, shoulder1..4 and gripper1..3 markers (m, Vicon world),
# then force plate 4: Fx, Fy, Fz (N), Mx, My, Mz (N m), COPx, COPy, COPz (m).
# There is no frame-index column in any source: row order is frame order.
# Robot identity is unknown for all runs: a Vicon and force-plate log carries
# no robot channel, and the encoder-gap fingerprint of the robot bags of the
# day does not settle it (see the README).
name: tiago-creps-vicon-2023
version: 1
units: {length: m, force: N, moment: N m}
clock: "host receive time of each frame, not the Vicon frame time; spacing 7 to 65 ms around a 10 ms median; robot bags are not synchronised with it"
columns: 40
