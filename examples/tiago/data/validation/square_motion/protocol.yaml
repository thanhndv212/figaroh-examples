# TIAGo square-motion validation runs (examples#107, C5 Phase 2) as a
# data-contract Protocol (figaroh-plus#55). Role is validation only: none of
# these runs is ever used to fit. Independent of the calibration protocols.
# Each run is two files on ONE clock, the robot clock in seconds from the first
# joint sample: <run>_joints.csv (eight joint positions at 100 Hz) and
# <run>_markers.csv (Qualisys samples, frame Qualisys, metres; bodies base_frame
# and the end-effector body; no interpolation, a lost marker is a gap).
# source: the original recordings (not distributed), PAL introspection + Qualisys
# /tf of the same bag, by filename and sha256. clock: marker stamps are on the
# mocap PC clock; lag_s = t_robot - t_mocap measured by speed-profile
# cross-correlation (coarse +-60 s at 0.05 s, then 0.005 s) of the nominal-FK
# wrist_ft_tool_link speed against the end-effector marker speed, correlation
# stored as lag_correlation; t_robot = stamp + lag_s, t = t_robot - t0_unix_s.
# examples/tiago/utils/square_motion_extraction.py re-creates every file byte
# for byte and checks the lag.
# nominal_registration_rmse_mm: RMS distance of nominal-FK tool point to the
# marker path after a rigid fit + fixed tool point (a consistency check of the
# one clock, not a calibration). end_effector: 2021-12 is the plate point
# eeframe_BL (and BR/TR/TL), 2022-01 the rigid body endeffector_frame.
# offset_sets: the joint-offset set the robot was running, with values (parent
# side joint-origin offsets of arm_1..arm_7, translation m + rotation vector rad)
# recovered from the recorded /tf versus the nominal URDF. unknown = not
# established from the data. The 2022-01-12 zero folder holds a usable run.
# not_shipped: recordings that hold no usable square, with the reason.
