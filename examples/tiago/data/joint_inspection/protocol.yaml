# TIAGo arm_5/arm_6 joint-inspection recordings, 2023-12 to 2024-02
# (examples#110), for the backlash transfer study (#71) as a data-contract
# Protocol (figaroh-plus#55). All sessions are diagnostic: they test whether
# the backlash surface explains the encoder differences, they are not used to
# fit or score a calibration. Roles are frozen: changing a file or a role
# needs a new version.
# Sources are original recordings (not distributed), named by file name and
# sha256. Every shipped CSV is `examples/tiago/utils/introspection_extraction.py`
# `inspection` of its bag (arm_5 and arm_6 position, absolute encoder and
# commanded position, native 100 Hz, values unchanged), re-created byte for
# byte by `tests/test_tiago_introspection_extraction.py`.
# Dates are the bag stamps (UTC). Folder and file names carry the recording
# PC's local time (UTC+1 in winter), so a name's hour is the bag hour plus
# one. The two `arm_6_backlash_abs_inspect` bags are stamped 2024-01-26 but
# sit in the 2024-01-25 folder. `arm5_minus1_59` was recorded an hour before
# the other 2024-02-02 bags (stamp 15:17Z, the rest 16:25Z to 16:51Z); the
# stamp agrees with its name.
# The 2023-10-25 joint-encoder inspection is not usable (below). The audit of
# the recordings counts 15 arm_5 bags; 14 exist.
name: tiago-joint-inspection-2023-2024
version: 1
units: {angle: rad, time: s}
columns: "t (s from the first sample, header stamp, rounded to 1 microsecond), then arm_5 and arm_6 as <joint>_position (relative, motor-side encoder divided by the gear ratio), <joint>_absolute (output-side absolute encoder) and <joint>_command (commanded position)"
clock: "introspection header stamp (secs, nsecs), robot clock, one clock for all columns of a file; rosbagTimestamp is the recording PC and runs 10 to 16 s behind the header stamp in every session, a per-session offset that changes with the recording"
sessions:
