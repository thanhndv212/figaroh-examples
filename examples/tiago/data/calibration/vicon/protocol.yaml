# TIAGo Vicon 2023-09-20 static postures (examples#106, v2 examples#100) as a
# data-contract Protocol (figaroh-plus#55). Per-system protocol: independent of
# ../mocap/protocol.yaml (Qualisys) and ../optitrack/protocol.yaml. Roles are
# frozen: changing a file or a role needs a new version.
# v2 (examples#100) assigns the roles the v1 note deferred to the
# motion-capture study and adds the heldout: block. The two files and their
# sha256 are unchanged. v1 roles: 1508 and 1607 were both `confirmation` ("not
# yet looked at"; v1 had no heldout: block and no run was evaluated). v2 roles:
# 1508 training, 1607 confirmation. No validation role. Why the change is
# legitimate (rule 4 of docs/development/tiago-mocap-heldout-protocol.md): v1
# deferred the held-out split to #100, and its "confirmation" meant only "not
# yet looked at"; no joint-level model was fitted or scored on either session
# (the registration-only sanity fits in tests/test_tiago_vicon_2023_09_20.py
# are the baseline and informed no choice); the roles follow a rule stated
# before any fit (training = the largest usable run, which leaves the most new
# postures in confirmation); nothing is selected on any role (the harness
# `select` refuses confirmation). See docs/development/tiago-mocap-hardware.md.
# The Vicon files hold labelled markers, not rigid bodies. The shipped "bodies"
# are marker triads (gripper1..3 -> x1..phiz1, base1..3 -> xb..phizb), frame
# defined in examples/tiago/utils/vicon_extraction.py; their relation to the
# TIAGo link frames is unknown (free registration). Shoulder markers are not
# shipped.
# source: the original recordings (not distributed): the Vicon export and the
# PAL introspection bag of the same run (joints), with sha256, and the clock
# lag measured from them (t_robot - t_mocap, correlation of the gripper centroid
# speed with the nominal-FK tool speed). The csv clock is the Vicon PC wall time
# (written without a zone, read as UTC+2). The c3d has no absolute clock: its
# time axis starts at the first joint sample, so its lag includes that origin.
# examples/tiago/utils/vicon_extraction.py re-creates each file byte for byte
# and checks the lag. drops: plateaus found and plateaus without a tracked
# gripper triad (none here).
# rigid_bodies: the gripper marker triad of each file, as median side lengths
# |m1m2|, |m1m3|, |m2m3| (mm). The gripper markers were placed differently in
# the two runs, so the two definitions are never pooled without a tool
# registration per definition. The base triad is the same in both runs.
# relabelled_frames: Vicon exchanged the labels gripper1 and gripper2 on 40 % of
# the 1607 csv frames (276 jumps of 100-150 mm between consecutive frames); the
# extractor restores the majority labelling by side lengths before averaging
# (repair_triad_labels). The 1508 c3d has no exchange (no jump above 19 mm).
# not_shipped: recordings of the session that hold no usable mocap postures.
name: tiago-vicon-2023-09-20
version: 2
rigid_bodies:
  1:
    name: gripper1-3 marker triad
    used_by: [2023-09-20-1508]
    gripper_sides_mm: [162.7, 109.5, 104.1]
    base_sides_mm: [411.3, 326.0, 334.4]
  2:
    name: gripper1-3 marker triad
    used_by: [2023-09-20-1607]
    gripper_sides_mm: [142.9, 49.8, 113.5]
    base_sides_mm: [412.4, 326.4, 334.8]
    note: gripper markers placed differently from definition 1; shortest side 50 mm; sides are those after the gripper1/gripper2 label repair
