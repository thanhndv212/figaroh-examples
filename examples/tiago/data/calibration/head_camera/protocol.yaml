# TIAGo head-camera chessboard sessions, 2023-10 to 2023-11 (examples#108) as a
# data-contract Protocol (figaroh-plus#55). Roles are frozen: changing a file
# or a role needs a new version.
# Sources are original recordings (not distributed), named by file name and
# sha256. Camera side: the CSV written by PAL's eye-hand calibration tool
# (chessboard pose in the camera frame and joints per posture); the
# examples/tiago/utils/head_camera_extraction.py `camera_files` function
# re-creates the pose and joints tables from it byte for byte. Mocap side
# (2023-10-27 and 2023-11-07): chessboard pose in the tiago_camera body per
# static plateau from the original bag, re-created byte for byte by
# `extract_run`. drops: plateaus found, and why plateaus were not kept
# (unpaired, lost, ambiguous, flipped); repaired = kept plateaus that had
# flipped samples removed. The sessions repeat one posture plan, so the splits
# are not independent in posture.
name: tiago-head-camera-2023
