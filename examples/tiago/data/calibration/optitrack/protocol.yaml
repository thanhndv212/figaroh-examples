# TIAGo OptiTrack 2023-09-12 static postures (examples#105) as a data-contract
# Protocol (figaroh-plus#55). Per-system protocol: independent of
# ../mocap/protocol.yaml (Qualisys). Roles are frozen: changing a file or a role
# needs a new version. No heldout: block: the shared harness needs exactly one
# training session, and none of these runs is evaluated before the
# motion-capture study (examples#100), which adds the block in v2.
# source: the original recording (not distributed), its sha256 and the clock
# lag measured from it (t_robot - t_mocap, the difference of the median
# receive-minus-header stamp offsets of the mocap and robot streams);
# examples/tiago/utils/optitrack_extraction.py re-creates each file byte for
# byte (--frame world) and checks the lag. drops: plateaus found and plateaus
# without a tracked gripper body (the files keep every other plateau; the
# tiago_base pose is in extra columns, NaN where that body was not tracked).
# rigid_bodies: the gripper body definition written to each file. Sessions with
# different definitions are never pooled without a tool registration per
# definition.
name: tiago-optitrack-2023-09-12
version: 1
rigid_bodies:
  1:
    name: tiago_schunk
    used_by: [2023-09-12-1529, 2023-09-12-1552]
  2:
    name: tiago_schunk
    used_by: [2023-09-12-1658]
    note: redefined between 15:52 and 16:58 (a constant 5-7 deg tool-frame rotation)
sessions:
