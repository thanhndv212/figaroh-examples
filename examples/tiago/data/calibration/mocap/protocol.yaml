# TIAGo mocap held-out protocol v2 (examples#27, #104) as a data-contract
# Protocol
# (figaroh-plus#55, examples#17): which recording plays which role, with each
# file's sha256. Paths are relative to this directory. Roles and hashes match
# docs/development/tiago-mocap-heldout-protocol.md; changing a file or a role
# needs a new protocol version (rule 4 there). The heldout: block is read by
# examples/calibration_harness (core's Protocol.load ignores it).
# v2 adds the two 2021-10-26 static-posture sessions as confirmation sessions
# (examples#104); v1's four sessions, roles and hashes are unchanged. The new
# sessions are in the Qualisys world frame (no base body in view), so they are
# listed in heldout.not_evaluated: the manifest freezes and verifies them, but
# the base-frame held-out protocol does not evaluate them (study: examples#100).
# source: the original recording (not distributed), its sha256 and the lag that
# re-create the file byte for byte with examples/tiago/utils/mocap_extraction.py
# (--frame world).
