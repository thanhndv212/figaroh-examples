  robot_evidence: "median position minus absolute-encoder gap on arm_1, arm_2, arm_7 (-3.7, -5.3, +2.3 mrad) equals that of the 2023-07-24 run (-3.6, -5.2, +2.7) and of the tiago-48 Hey5 bags of 2023-11 to 2024-02 (-3.8 to -4.6, -4.1 to -6.9, +3 to +7). The hand channels are the Schunk hand's (a single gripper_finger_joint plus fingertip force channels, as in the 2023-07-24 run), not Hey5 hand channels. This fits tiago-48, which carried the Schunk hand in 2023-03 and 2023-07 and the Hey5 hand in 2023-10 and 2023-11; the other robot (tiago-155c) has a PAL gripper. The URDF for gravity torque is tiago_48_schunk.urdf"
