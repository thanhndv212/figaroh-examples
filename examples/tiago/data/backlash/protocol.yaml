# TIAGo backlash sinusoid sessions, 2023-03-09 and 2023-07-24 (examples#109),
# for the backlash transfer study (#71) as a data-contract Protocol
# (figaroh-plus#55). Roles are frozen: changing a file or a role needs a new
# version.
# Sources are original recordings (not distributed), named by file name and
# sha256. Bottom run: the introspection bag; the shipped names and values CSV
# are `examples/tiago/utils/introspection_extraction.py` `export` of it (the 33
# channels `backlash_channels` lists: the leading statistics channel and the position, velocity, effort and absolute
# encoder of torso_lift and arm_1..arm_7, values unchanged), re-created byte for
# byte by `tests/test_tiago_introspection_extraction.py`. Top run: only the
# exporter's tf.csv survives (no bag, no joint values); it is shipped as found.
# 2023-07-24: the shipped CSV pair predates this protocol and has no raw bag.
name: tiago-backlash-sinus-2023
version: 1
units: {angle: rad, velocity: rad/s, effort: "N m (arm), N (torso_lift)", length: m, time: s}
clock: "introspection header stamp (secs, nsecs), robot clock; rosbagTimestamp is the recording PC and differs from it by a per-session offset (64 s on 2023-03-09 bottom, 2454 s on 2023-07-24)"
sessions:
