# LC1 comparison (#11) on recorded TIAGo data, corrected OLS+SDP: the linear
# baseline, then each link's reconstructed inertials projected onto the
# physically consistent set by an LMI (cvxopt). Not selectable as a stage:
# the run reports the base fit and the projection under
