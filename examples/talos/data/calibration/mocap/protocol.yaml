# TALOS torso-arm Qualisys motion-capture sessions of 2022-03-15 (examples#114)
# as a data-contract Protocol (figaroh-plus#55). Roles are frozen: changing a
# file or a role needs a new version. No heldout: block: the calibration study
# that evaluates these sessions is a follow-up issue, which adds the block in v2.
# Three sessions, all usable (>= 15 plateaus kept; the gate below). Roles:
# training = left arm, validation = right arm (the two roles span the two
# arms, as the issue asks), confirmation = the third run (right arm, a
# different set of 23 postures: none of its postures repeats one of the
# validation run within 5 mrad, so it neither extends the training nor repeats
# the validation).
# Frame: every body is expressed in the Qualisys world frame. The recordings
# hold three bodies (waist_frame, upper_body_frame, endeffector_frame); which
# robot link each is mounted on, and the offset from that link, are unknown
# and are not guessed (free registration in a study). Both waist_frame and
# upper_body_frame move with the torso joints, so none of the three bodies is
# a fixed base reference.
# source: the original recording (not distributed): the ROS bag, with sha256, and
# the clock lag measured from it (t_robot - t_mocap). The bag holds joint
# positions from the PAL introspection statistics and the Qualisys poses from
# /tf_throttle; header stamps of both are on the same ROS clock to within 0.1 s.
# Lag method (examples/talos/utils/mocap_extraction.py, estimate_clock_lag):
# maximum correlation between the upper_body_frame angular speed and the speed
# norm of torso_1/torso_2 over +-2 s in 0.02 s steps; the peak is flat to about
# 0.1 s, far inside the 0.5 s head and 0.3 s tail trimmed from each plateau.
# examples/talos/utils/mocap_extraction.py re-creates each file byte for byte
# and checks the lag, drops and audit below.
# drops: plateaus found (joints within 1 mrad over 0.5 s, at least 2 s), those
# with too few samples of a body inside the window (the end-effector body comes
# at about 1 Hz and needs 3), and those with a body coordinate std above 5 mm.
# audit: per stream, over the whole bag. frozen = pose identical to the
# previous sample of its body. tracking loss = gap above 5 median periods
# between samples of a body (a lost body publishes nothing; there is no NaN or
# flag in the bag), reported as gap count and total seconds. Joint stream: no
# gaps above 0.042 s (maximum interval).
name: talos-mocap-2022-03-15
version: 1
bodies:
  waist: {frame: waist_frame, parent: Qualisys, attached_to: unknown}
  upper_body: {frame: upper_body_frame, parent: Qualisys, attached_to: unknown}
  endeffector: {frame: endeffector_frame, parent: Qualisys, attached_to: unknown}
sessions:
