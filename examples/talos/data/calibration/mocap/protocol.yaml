# TALOS torso-arm Qualisys motion-capture sessions of 2022-03-15 (examples#114)
# as a data-contract Protocol (figaroh-plus#55). Roles are frozen: changing a
# file or a role needs a new version. The heldout: block is read by
# examples/calibration_harness (core's Protocol.load ignores it).
#
# v2 (examples#172, the calibration study; written and committed before any
# study model was fitted to these files). Files, hashes and roles are those of
# v1. Added: the body attachments, the heldout: block, and the rules below.
# The study is examples/talos/mocap_heldout.py and its pre-registration is
# docs/development/talos-mocap.md (section 3).
#
# - Attachments (bodies: below), found from the data before the study with
#   the nominal model and a free 6D registration per body: waist_frame on
#   base_link, upper_body_frame on torso_2_link (0.29 mm, 0.16 deg RMS on the
#   training run; every other pair of links 8 to 24 mm), endeffector_frame on
#   arm_<side>_7_link (links 4 to 6: 37 to 76 mm). The offsets stay unknown
#   and are estimated. waist_frame moves in the world (up to 0.2 m over a
#   run: the base is not fixed) but rides on base_link, so it is the base
#   reference; the robot base pose in the world is not recorded and is not
#   needed.
# - Measurement: the end-effector body in the waist body frame,
#   inverse(waist) * endeffector, 6D. upper_body_frame is not used by the
#   study: it would only observe the torso, whose errors it absorbs.
# - Orientation flips: Qualisys sometimes reports the end-effector body in a
#   rotated frame (a different marker labelling of the same rigid body).
#   Rule, fit-free, on the nominal model: rotation of the body relative to
#   arm_<side>_7_link with the waist rotation taken as identity; a row is
#   flipped when it is more than 45 deg from the session medoid (the row
#   within 45 deg of the most others). Flipped rows are grouped by the same
#   45 deg rule into clusters. The validation run has 14 of 39 such rows
#   (the training run none; the confirmation run was not inspected). Each
#   cluster k is repaired, not dropped: a rotation R_k about a marker
#   centroid c shared by all clusters, S_k = (R_k, (I - R_k) c) on the body
#   side, estimated with the registration of the session.
# - Held-out metric (PRIMARY_METRIC in mocap_heldout.py, the harness schema
#   has no key for it): end-effector position RMSE in the waist frame (mm),
#   RE-REGISTERED: on the evaluated session the waist and end-effector
#   registrations (6D each) and the flip repair are refitted; the model's
#   torso parameters are carried over, the evaluated arm is nominal.
#   Secondary: the waist registration carried over from training (the same
#   body on the same link).
# - Strata are over the torso joints only: the held-out runs move the other
#   arm, so every held-out arm posture is new to the training.
# - Model selection: on the k-fold plan of the training run
#   (protocol_1354_kfold.yaml, development evidence), never on the
#   confirmation run. The validation run judges the torso transfer.
#
# Three sessions, all usable (>= 15 plateaus kept; the gate below). Roles:
# training = left arm, validation = right arm (the two roles span the two
# arms, as the issue asks), confirmation = the third run (right arm, a
# different set of 23 postures: none of its postures repeats one of the
# validation run within 5 mrad, so it neither extends the training nor repeats
# the validation).
# Frame: every body is expressed in the Qualisys world frame. The recordings
# hold three bodies (waist_frame, upper_body_frame, endeffector_frame); v1
# left their links unknown, v2 records them (above).
# source: the original recording (not distributed): the ROS bag, with sha256, and
# the clock lag measured from it (t_robot - t_mocap). The bag holds joint
# positions from the PAL introspection statistics and the Qualisys poses from
# /tf_throttle; header stamps of both are on the same ROS clock to within 0.1 s.
# Lag method (examples/talos/utils/mocap_extraction.py, estimate_clock_lag):
# maximum correlation between the upper_body_frame angular speed and the speed
# norm of torso_1/torso_2 over +-2 s in 0.02 s steps; the peak is flat to about
# 0.1 s, far inside the 0.5 s head and 0.3 s tail trimmed from each plateau.
# examples/talos/utils/mocap_extraction.py re-creates each file byte for byte
# and checks the lag, drops and audit below.
# drops: plateaus found (joints within 1 mrad over 0.5 s, at least 2 s), those
# with too few samples of a body inside the window (the end-effector body comes
# at about 1 Hz and needs 3), and those with a body coordinate std above 5 mm.
# audit: per stream, over the whole bag. frozen = pose identical to the
# previous sample of its body. tracking loss = gap above 5 median periods
# between samples of a body (a lost body publishes nothing; there is no NaN or
# flag in the bag), reported as gap count and total seconds. Joint stream: no
# gaps above 0.042 s (maximum interval).
name: talos-mocap-2022-03-15
version: 2
bodies:
  waist: {frame: waist_frame, parent: Qualisys, attached_to: base_link}
  upper_body: {frame: upper_body_frame, parent: Qualisys, attached_to: torso_2_link}
  endeffector: {frame: endeffector_frame, parent: Qualisys, attached_to: arm_<side>_7_link}
