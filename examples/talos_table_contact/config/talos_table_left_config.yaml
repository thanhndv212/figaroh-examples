# TALOS table-contact calibration -- left leg -> torso -> left arm chain
#
# Unified format (extends: + tasks.*), migrated from the legacy flat schema with
# python -m figaroh.utils.config_migration (figaroh-examples#125). The plane-pose and
# contact-frame parameters this example adds (PLANE_TPL / CONTACT_TPL) are appended in
# Python by TalosTableContactCalibration.initialize(); the config schema has no field
# for them (see examples/talos_table_contact/README.md).
#
# 3 of 6 end-effector pose DOF are informative from a flush table touch: height along
# the table normal (z) and the two in-plane tilts (roll, pitch); x, y and yaw are
# unobservable and left out of the marker mask. nb_sample is overwritten by
# TalosTableContactCalibration.load_data_set() with the row count of data_file;
# data_file is overridden programmatically by the demo/test scripts. Outlier
# rejection and the regularization coefficient are off (null).

extends: ../../templates/base_robot_config.yaml
robot:
  name: "talos"
  description: "TALOS table-contact, left chain"
tasks:
  calibration:
    enabled: true
    type: kinematic_calibration
    parameters:
      calibration_level: full_params
      include_non_geometric: false
      regularization_coefficient: null
      outlier_threshold: null
    kinematics:
      base_frame: left_sole_link
      tool_frame: gripper_left_base_link
      free_flying_base: false
    measurements:
      markers:
      - reference_joint: null
        measurable_dof:
        - false
        - false
        - true
        - true
        - true
        - false
      poses:
        base_pose: null
        tool_pose: null
    data:
      source_file: data/table_contact_train.csv
      sample_configurations_file: null
      number_of_samples: 1
  identification:
    enabled: false
